<div class="container text-center">
    <h1 class="text-danger text-center mt-3">belajar pakai bootstrap</h1>
    <!-- 
    warna di boodstrap :
    primary (biru)
    secondary (abu-abu)
    danger (merah)
    warning (kuning)
    success (hijau)
    info (biru muda)
    dark (hitam)
    ligt (putih)
     -->
    <button class="btn btn-primary rounded-pill">klik saya</button>
    <button class="btn btn-secondary">klik saya</button>
    <button class="btn btn-danger">klik saya</button>
    <button class="btn btn-warning text-success">klik saya</button>

</div>
